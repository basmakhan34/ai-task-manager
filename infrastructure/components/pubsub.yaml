apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
  namespace: default
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    value: redpanda:29092
  - name: consumerGroup
    value: ai-task-manager-group
  - name: allowAutoCreateTopics
    value: "true"
  - name: authType
    value: "none"
  - name: maxMessageBytes
    value: "1000000"
  - name: protocol
    value: "plaintext"
